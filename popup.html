<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 18px;
      margin: 0;
      color: #333;
    }
    
    .config-section {
      margin-bottom: 20px;
    }
    
    .config-section h3 {
      font-size: 14px;
      margin: 0 0 10px 0;
      color: #666;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    
    .form-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #ff2442;
    }
    
    .save-btn {
      width: 100%;
      padding: 10px;
      background: #ff2442;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    
    .save-btn:hover {
      background: #e01e3c;
    }
    
    .save-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .help-text {
      font-size: 11px;
      color: #999;
      margin-top: 5px;
    }
    
    .help-link {
      color: #ff2442;
      text-decoration: none;
    }
    
    .help-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>小红书笔记收集器</h1>
  </div>
  
  <div class="config-section">
    <h3>飞书应用配置</h3>
    
    <div class="form-group">
      <label for="appId">App ID</label>
      <input type="text" id="appId" placeholder="请输入飞书应用的App ID">
      <div class="help-text">
        在 <a href="https://open.feishu.cn/app" target="_blank" class="help-link">飞书开放平台</a> 创建应用获取
      </div>
    </div>
    
    <div class="form-group">
      <label for="appSecret">App Secret</label>
      <input type="password" id="appSecret" placeholder="请输入飞书应用的App Secret">
    </div>
    
    <div class="form-group">
      <label for="appToken">多维表格App Token</label>
      <input type="text" id="appToken" placeholder="请输入多维表格的App Token">
      <div class="help-text">
        在多维表格URL中获取，格式如：bascnxxxxxxxxxxxxxx
      </div>
    </div>
    
    <div class="form-group">
      <label for="tableId">数据表ID</label>
      <input type="text" id="tableId" placeholder="请输入数据表的Table ID">
      <div class="help-text">
        在数据表URL中获取，或通过API获取表格列表
      </div>
    </div>
    
    <button class="save-btn" id="saveConfig">保存配置</button>
    
    <div id="status" class="status" style="display: none;"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
